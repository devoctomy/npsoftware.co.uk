<div class="social">
  <a class="icon-btn" href="mailto:{{ site.email }}" aria-label="Email">{% include icon.html name="mail" %}</a>
  <a class="icon-btn" href="https://www.linkedin.com/in/{{ site.linkedin_username }}" aria-label="LinkedIn" rel="noopener">{% include icon.html name="linkedin" %}</a>
  <a class="icon-btn" href="https://twitter.com/{{ site.twitter_username }}" aria-label="Twitter" rel="noopener">{% include icon.html name="x" px=16 %}</a>
  <a class="icon-btn" href="https://www.facebook.com/{{ site.facebook_username }}" aria-label="Facebook" rel="noopener">{% include icon.html name="facebook" %}</a>
  <a class="icon-btn" href="https://flipboard.com/@{{ site.flipboard_username }}" aria-label="Flipboard" rel="noopener">{% include icon.html name="flipboard" %}</a>
</div>
