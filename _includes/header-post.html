<header class="header-post" role="banner">
    <div class="content">
        {% if date %}
            <time itemprop="datePublished" datetime="{{ date | date_to_s }}" class="date">{{ date | date_to_string }}</time>
        {% endif %}
        <h1 class="post-title" itemprop="name">{{ title }}</h1>
        <p itemprop="description" class="subtitle">{{ description }}</p>
    </div>
     <a class="down" data-scroll href="#scroll"><svg class="icon icon-angle-down"><use xlink:href="#icon-angle-down"></use></svg></a>
     {% include menu-search.html %}
</header>
